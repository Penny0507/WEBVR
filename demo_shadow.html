<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

    <body>
     <a-scene>
          <a-box shadows="cast: true" position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" ></a-box>
          <a-sphere shadows="cast: true" position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
          <a-cylinder shadows="cast: true" position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
          <a-plane shadows="receive: true" rotation="-90 0 0" position="0 0 -4" width="4" height="4" color="#7BC8A4"></a-plane>
          <a-plane shadows="receive: true" position="0 2 -6" rotation="0 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
          <a-sky color="#ECECEC"></a-sky>
          <a-entity light="type: directional; color: #FFF; intensity: 4; castShadow: true;" position="-1 2.5 1"></a-entity>
     </a-scene>
    </body>
</html>
